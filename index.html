<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bloom Clinic — ملفات المرضى</title>
<meta name="theme-color" content="#1c364f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bloom Files">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- ============ قائمة الملفات ============ -->
<section id="home" class="view">
  <header class="topbar">
    <div class="brand"><img class="wordmark" src="img/logo-white.png" alt="BLOOM Dental Clinic"><small>ملفات المرضى</small></div>
    <div class="top-actions">
      <button class="ghost sync-btn" title="مزامنة"></button>
      <button class="ghost" id="btnBackup" title="نسخة احتياطية">⤓ <span>نسخة احتياطية</span></button>
      <button class="ghost" id="btnRestore" title="استرجاع نسخة">⤒ <span>استرجاع</span></button>
      <input type="file" id="restoreFile" accept=".json,application/json" hidden>
    </div>
  </header>
  <div class="home-tools">
    <div class="search"><input id="q" type="search" placeholder="ابحث بالاسم أو الموبايل أو رقم الملف" autocomplete="off"></div>
    <button class="primary" id="btnNew">+ ملف جديد</button>
  </div>
  <div class="count" id="count"></div>
  <div id="list" class="cabinet"></div>
</section>

<!-- ============ الملف ============ -->
<section id="file" class="view" hidden>
  <header class="topbar file-bar">
    <button class="ghost icon" id="btnClose" title="رجوع للملفات">→</button>
    <div class="file-title"><b id="ttlName">ملف جديد</b><small id="ttlNo"></small></div>
    <span class="saved" id="saved"></span>
    <div class="top-actions">
      <button class="ghost sync-btn" title="مزامنة"></button>
      <button class="ghost icon" id="btnZoom" title="تكبير">⊕</button>
      <button class="ghost icon" id="btnPrint" title="طباعة">⎙</button>
      <button class="ghost icon danger" id="btnDelete" title="حذف الملف">🗑</button>
    </div>
  </header>
  <div id="viewport" class="viewport">
    <div id="world" class="world">
      <div id="folder" class="folder">
        <div class="leaf base">
          <div class="face front" data-page="info"></div>
          <div class="face back" data-page="back"></div>
        </div>
        <div class="leaf cover" id="coverLeaf">
          <div class="face front" data-page="front"></div>
          <div class="face back" data-page="chart"></div>
        </div>
        <div class="spine-shadow"></div>
      </div>
    </div>
  </div>
  <footer class="filebar">
    <div class="ctx" id="ctx"></div>
    <nav class="seg" id="seg">
      <button data-go="cover">الغلاف</button>
      <button data-go="info">البيانات</button>
      <button data-go="chart">الأسنان</button>
      <button data-go="back">الحسابات</button>
    </nav>
  </footer>
</section>

<!-- نافذة الكتابة (موبايل) -->
<div id="sheet" class="sheet" hidden>
  <div class="sheet-card">
    <div class="sheet-head"><b id="sheetTitle"></b><button class="ghost icon" data-close>✕</button></div>
    <div id="sheetBody"></div>
    <div class="sheet-foot" id="sheetFoot"></div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>
<div id="print" class="print"></div>

<script src="sync-core.js"></script>
<script src="app.js"></script>
</body>
</html>
